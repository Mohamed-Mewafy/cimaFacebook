name: Run YouTube Script

on:
  schedule:
    - cron: '0 0 * * *' # يمكنك تعديل وقت الجدول الزمني حسب رغبتك
  workflow_dispatch: # للسماح بالتشغيل اليدوي من تبويب Actions

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        # ضع هنا أي مكتبات إضافية تحتاجها مثل yt-dlp أو غيره لو مش موجودة في requirements.txt
        # pip install yt-dlp

    - name: Write YouTube Cookies from Base64 Secret
      run: |
        echo "${{ secrets.YOUTUBE_COOKIES }}" | base64 --decode > cookies.txt

    - name: Run Main Script
      run: |
        python main.py # استبدل main.py باسم السكربت الرئيسي لديك

    - name: Clean up sensitive files
      if: always()
      run: |
        rm -f cookies.txt
