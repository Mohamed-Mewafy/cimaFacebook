name: run-bot

on:
  schedule:
    - cron: '0 */6 * * *' # أو حسب التوقيت اللي انت رابطه بيه
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install yt-dlp requests # أضف باقي المكتبات التي تحتاجها هنا

    # ⬅️ **هذه هي الخطوة الجديدة الخاصة بكتابة الكوكيز**
    - name: Write YouTube Cookies
      run: |
        cat << 'EOF' > cookies.txt
        ${{ secrets.YOUTUBE_COOKIES }}
        EOF

    - name: Run python main.py
      run: python main.py
